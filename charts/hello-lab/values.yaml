replicaCount: 2

image:
  repository: k8s-nfs:5000/hello-lab
  tag: v1
  pullPolicy: IfNotPresent

# Created separately with `kubectl create secret docker-registry` — see runbook. Deliberately
# NOT generated by this chart, so registry credentials never end up templated into a values file
# or checked into anything.
imagePullSecretName: registry-creds

service:
  port: 80
  targetPort: 80

resources:
  requests: {cpu: "50m", memory: "32Mi"}
  limits: {memory: "64Mi"}
