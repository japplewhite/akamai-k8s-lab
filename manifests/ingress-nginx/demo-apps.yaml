# Two trivial apps + one Ingress routing between them by hostname, and a NetworkPolicy
# default-deny drill in a separate namespace. Stage 2 of PROJECT-PLAN.md.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: app-a}
  template:
    metadata:
      labels: {app: app-a}
    spec:
      containers:
      - name: app-a
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args: ["netexec", "--http-port=8080"]
        ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: app-a
  namespace: demo
spec:
  selector: {app: app-a}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-b
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: app-b}
  template:
    metadata:
      labels: {app: app-b}
    spec:
      containers:
      - name: app-b
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args: ["netexec", "--http-port=8080"]
        ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: app-b
  namespace: demo
spec:
  selector: {app: app-b}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-ingress
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: app-a.lab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: {name: app-a, port: {number: 80}}
  - host: app-b.lab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: {name: app-b, port: {number: 80}}
